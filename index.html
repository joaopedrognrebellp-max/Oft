<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oftalmo Update</title>
<meta name="theme-color" content="#1f2328">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oftalmo Update">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --char:#1f2328; --char2:#2b3036; --gold:#c9a227; --gold2:#e6c45a;
  --bg:#f4f2ee; --card:#ffffff; --ink:#1d1f22; --muted:#626a73; --line:#e3dfd6;
  --yel:#ffe14d; --yel2:#fff3a6; --yelb:#d9b400;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171a; --card:#1e2125; --ink:#eceae5; --muted:#a3aab3; --line:#30343a; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"IBM Plex Sans","DejaVu Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}

/* Header */
header{background:var(--char);color:#fff;padding:18px 18px 14px;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;max-width:980px;margin:0 auto}
.brand h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:22px;margin:0;letter-spacing:.2px}
.brand h1 span{color:var(--gold2)}
.edition{font-size:12px;color:#c8ccd1;margin-left:auto}
.subtitle{max-width:980px;margin:4px auto 0;font-size:13px;color:#aeb4bb}

/* Tabs */
nav{position:sticky;top:0;z-index:20;background:var(--char2);border-bottom:1px solid #000}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;max-width:980px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid #444a52;background:transparent;color:#d9dde2;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tab[aria-selected="true"]{background:#fff;color:var(--char);border-color:#fff;font-weight:600}

main{max-width:980px;margin:0 auto;padding:18px 14px 60px}
.area-head{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
.area-head h2{font-family:"IBM Plex Serif",Georgia,serif;font-size:24px;margin:0}
.area-head .bar{width:6px;height:30px;border-radius:3px}
.area-head p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* Weekly yellow box — elevated */
.weekly{position:relative;background:linear-gradient(160deg,var(--yel2),var(--yel));color:#2a2400;border:2px solid var(--yelb);border-radius:18px;padding:22px 20px 18px;margin:8px 0 28px;box-shadow:0 14px 28px -10px rgba(140,110,0,.55),0 3px 0 var(--yelb);transform:translateY(-6px)}
.weekly .flag{position:absolute;top:-13px;left:16px;background:var(--char);color:var(--yel);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:2px solid var(--yelb)}
.weekly h3{font-family:"IBM Plex Serif",Georgia,serif;font-size:20px;line-height:1.25;margin:4px 0 6px}
.weekly .date{display:inline-block;font-size:16px;font-weight:700;background:var(--char);color:var(--yel);padding:4px 11px;border-radius:8px;margin:6px 0 4px}
.weekly p{margin:8px 0}
.weekly ul{margin:6px 0 8px;padding-left:20px}
.weekly .pearl{background:rgba(255,255,255,.55);border-left:4px solid var(--char);border-radius:8px;padding:9px 12px;margin-top:10px;font-size:14px}
.weekly .src a{color:#3d3300}

/* Sections */
.section{margin:26px 0 10px}
.section h4{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.section h4::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr}}

.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac,#888);border-radius:var(--radius);padding:13px 14px 12px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:5px}
.card .d{font-size:12px;color:var(--muted);font-weight:500;margin-right:2px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#eceae4;color:#3c4148;white-space:nowrap}
@media (prefers-color-scheme: dark){.chip{background:#2c3036;color:#d0d4d9}}
.chip.fda{background:#e3ecfb;color:#1f4d9a}
.chip.br{background:#dff3e4;color:#1c6b33}
.chip.f3{background:#f6e6fb;color:#6d2a86}
.chip.dev{background:#fdeedd;color:#8a4a0b}
.chip.drop{background:#dcf1ee;color:#11695f}
.chip.area{background:transparent;border:1px solid currentColor}
.card h5{font-size:15.5px;margin:0 0 4px;line-height:1.3}
.card p{margin:0;font-size:14px;color:var(--ink)}
.card .pearl{margin-top:8px;font-size:13px;background:#faf6e8;border-left:3px solid var(--gold);padding:6px 9px;border-radius:6px;color:#4a3f17}
@media (prefers-color-scheme: dark){.card .pearl{background:#2a2619;color:#e9dcae}}
.card .src{margin-top:8px;font-size:12px;color:var(--muted)}
.card .src a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}

/* Radar table */
.radar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.radar .row{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.radar .row:first-child{border-top:0}
.radar .when{font-weight:700;color:var(--gold);font-size:13px}
.radar .what b{font-weight:600}
.radar .what span{display:block;color:var(--muted);font-size:12.5px}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.search{flex:1 1 220px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px}
.fbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.fbtn.on{background:var(--char);color:#fff;border-color:var(--char)}
.empty{color:var(--muted);font-size:14px;padding:12px 2px}

.top3{display:grid;gap:10px;margin-top:10px}
.top3 .t{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.55);border-radius:10px;padding:9px 11px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;width:100%}
.top3 .n{font-family:"IBM Plex Serif",Georgia,serif;font-weight:700;font-size:20px;line-height:1;color:var(--char);min-width:18px}
.top3 .t b{display:block}
.top3 .t small{opacity:.8}

.card{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(0,0,0,.35)}
.card .more{display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;font-weight:600;color:var(--ac)}
.sheet-bg{position:fixed;inset:0;background:rgba(15,17,20,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;border-top:6px solid var(--ac,#888);padding:10px 18px 28px;animation:up .2s ease}
@media(min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:18px;border-top-width:6px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .top{display:flex;gap:10px;align-items:flex-start}
.sheet h3{font-family:"IBM Plex Serif",Georgia,serif;font-size:20px;line-height:1.25;margin:4px 0 8px;flex:1}
.sheet .x{border:0;background:var(--bg);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;flex:0 0 auto}
.sheet .lead{font-size:14.5px;color:var(--muted);margin:0 0 6px}
.blk{margin-top:14px}
.blk h6{margin:0 0 5px;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ac)}
.blk p{margin:0;font-size:14.5px}
.blk ul{margin:0;padding-left:0;list-style:none}
.blk li{position:relative;padding:7px 10px 7px 30px;margin-bottom:6px;background:var(--bg);border-radius:9px;font-size:14.5px}
.blk li::before{content:"";position:absolute;left:11px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.sheet .pearl{margin-top:14px;font-size:14px;background:#faf6e8;border-left:4px solid var(--gold);padding:9px 11px;border-radius:8px;color:#4a3f17}
@media (prefers-color-scheme: dark){.sheet .pearl{background:#2a2619;color:#e9dcae}}
.sheet .src{margin-top:14px;font-size:13px;color:var(--muted)}
.sheet .src a{color:var(--muted)}
.chead{display:flex;gap:12px;align-items:flex-start}
.cright{flex:1;min-width:0}
.dbig{flex:0 0 auto;width:62px;text-align:center;border-radius:11px;background:var(--ac);color:#fff;padding:6px 4px 7px;line-height:1}
.dbig b{display:block;font-family:"IBM Plex Serif",Georgia,serif;font-size:28px;font-weight:700}
.dbig span{display:block;font-size:11px;font-weight:600;letter-spacing:.6px;margin-top:4px;opacity:.95}
.dbig.partial b{font-size:19px;padding-top:4px}
.dbig.partial span{font-size:9.5px;letter-spacing:.2px}
.sdate{display:inline-block;font-size:17px;font-weight:700;color:#fff;background:var(--ac);padding:5px 12px;border-radius:9px;margin:2px 0 10px}
.card .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.card .detail-in{overflow:hidden}
.card.open .detail{grid-template-rows:1fr}
.card.open{grid-column:1/-1;box-shadow:0 14px 30px -14px rgba(0,0,0,.35);transform:none}
.card .arr{transition:transform .25s ease;display:inline-block}
.card.open .arr{transform:rotate(180deg)}
.dtitle{margin-top:14px;padding-top:12px;border-top:2px solid var(--ac);font-family:"IBM Plex Serif",Georgia,serif;font-weight:700;font-size:17px}
.entenda{margin-top:10px;background:color-mix(in srgb, var(--ac) 9%, var(--card));border-radius:10px;padding:10px 12px}
.entenda h6,.card .blk h6{margin:0 0 5px;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ac)}
.entenda p{margin:0;font-size:14.5px;line-height:1.6}
.card .blk{margin-top:12px}
.card .blk p{font-size:14.5px;line-height:1.55}
.card .blk ul{margin:0;padding:0;list-style:none}
.card .blk li{position:relative;padding:7px 10px 7px 28px;margin-bottom:6px;background:var(--bg);border-radius:9px;font-size:14.5px}
.card .blk li::before{content:"";position:absolute;left:11px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.card .detail .src{margin-top:12px}
footer{max-width:980px;margin:0 auto;padding:10px 16px 40px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}

/* ===== Ao vivo + avisos ===== */
.tab .new{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--yel);color:#2a2400;font-size:11px;font-weight:700;text-align:center}
.pushbox{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:var(--radius);padding:14px 15px;margin:4px 0 22px}
.pushbox h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.pushbox p{margin:4px 0 10px;color:var(--muted);font-size:13.5px}
.pushbox .st{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eceae4;color:#3c4148}
.pushbox .st.ok{background:#d8f2df;color:#17602b}
.pushbox .st.warn{background:#fff0c2;color:#7a5a00}
@media (prefers-color-scheme: dark){.pushbox .st{background:#2c3036;color:#d0d4d9}.pushbox .st.ok{background:#173d22;color:#9fe0b0}.pushbox .st.warn{background:#3d3210;color:#f1d27a}}
.pbtn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--char);color:#fff;margin:2px 8px 2px 0}
.pbtn.gold{background:var(--gold);color:#1f2328}
.pbtn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.subcode{width:100%;min-height:96px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);margin-top:8px}
.steps{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink)}
.steps li{margin:3px 0}
.livemeta{font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
.lcard{cursor:default}
.lcard .lk{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--ac,#555);text-decoration:none}
.lcard .lk:hover{text-decoration:underline}
.lcard.isnew{box-shadow:0 0 0 2px var(--yel)}
.chip.src{background:transparent;border:1px solid var(--line)}
.chip.nv{background:var(--yel);color:#2a2400}
</style>
</head>

    {t:"70º Congresso Brasileiro de Oftalmologia (Salvador)", d:"2026-09-12", tags:["Brasil","Congresso"], s:"O CBO lançou recomendações de rotina de consultas por faixa etária e, com a SBOP, a cartilha «Mais Tempo ao Ar Livre» sobre telas e miopia infantil.", src:[["Agência Brasil","https://agenciabrasil.ebc.com.br/saude/noticia/2026-09/saiba-qual-e-rotina-ideal-de-consultas-para-cuidar-da-visao"],["Correio da Manhã","https://www.correiodamanha.com.br/especiais/2026/10/324945-oftalmologistas-alertam-para-utilizacao-excessiva-de-telas-e-miopia-em-criancas.html"]]},

    body:"<ul><li><b>VG801 (VeonGen)</b> — terapia gênica dual-AAV para ABCA4: FDA concordou com o desenho da fase 3. Na fase 1/2 (sem controle), 11 de 13 pacientes avaliáveis ganharam ≥5 letras.</li><li><b>CITY-RBP4 (City Therapeutics)</b> — RNAi conjugado a GalNAc que reduz a RBP4 hepática: 1º participante dosado na fase 1; dados em meados de 2027.</li><li><b>Tinlarebant (Belite Bio)</b> — antagonista oral de RBP4: NDA em revisão prioritária, PDUFA 12/02/2027, após 24 meses do DRAGON apresentados na AAO.</li></ul>",

{ id:"neuro", name:"Neuro-oftalmo", color:"#4b5bd6", desc:"Nervo óptico, vias visuais e motilidade",

    body:"<p>O FDA vai incluir NAION na seção de advertências de todos os agonistas do receptor de GLP-1, citando metanálise com 6,4 vs 3,8 casos por 100 mil pessoas-ano. AAO, NANOS e AOA responderam que o risco é raro, a causalidade não está comprovada e que perda visual súbita exige avaliação oftalmológica imediata.</p>",

{ id:"labs", name:"Laboratórios & Colírios", color:"#2f8f3a", desc:"Colírios, injetáveis, implantes farmacológicos e notícias de laboratórios",
  subs:["Colírios","Brasil & Anvisa"],
  weekly:{ title:"Brasil: Dompé e Multicare Pharma fecham parceria em oftalmologia", date:"4 nov 2026",
    body:"<p>A italiana Dompé — fabricante da cenegermina (NGF recombinante) — e a brasileira Multicare Pharma, focada em doenças raras e de alta complexidade, anunciaram parceria estratégica no Brasil para ampliar informação e conhecimento em doenças oftalmológicas, unindo a experiência da Dompé em oftalmologia ao conhecimento da Multicare sobre o sistema de saúde brasileiro.</p><p>Contexto: a Dompé também tem a cenegermina em fase 3 para NAION e a isociclosporina em fase 3 para ceratoconjuntivite atópica.</p>",
    pearl:"<b>Pérola:</b> ceratite neurotrófica — estágios de Mackie: 1) ceratopatia puntata/epitélio irregular; 2) defeito epitelial persistente; 3) úlcera estromal ± perfuração. A cenegermina é usada 1 gota 6×/dia por 8 semanas.",

/* EXPLICAÇÕES DIDÁTICAS («Entenda») — chave = título exato */
const EXPL = {
"Nobel de Medicina 2026 premia a optogenética":"Na retinose pigmentar os fotorreceptores morrem, mas células bipolares e ganglionares sobrevivem por anos. Um vetor viral faz essas células produzirem uma opsina; elas passam a responder à luz e viram uma nova «camada fotossensível». Algumas plataformas precisam de óculos que intensificam a luz; a opsina da Nanoscope foi desenhada para funcionar com luz ambiente. A visão obtida é de baixa resolução, mas pode devolver orientação e percepção de objetos.",
"AAO 2026 (Nova Orleans): os grandes temas":"A AAO é o principal termômetro do que chega à prática nos EUA e, depois, ao Brasil. Neste ano, o eixo comum foi reduzir a carga de tratamento: anti-VEGF com intervalos de 6 meses ou mais, implantes de liberação prolongada, terapias gênicas de dose única e dispositivos que diminuem a dependência de colírios no glaucoma.",
"Fila de transplante de córnea no Brasil cresce 24% em seis meses":"O gargalo é a oferta de tecido. Técnicas lamelares (DALK, DMEK/DSAEK) usam melhor cada córnea e têm menos rejeição; terapias de células endoteliais cultivadas podem, no futuro, permitir que uma única córnea doadora trate vários pacientes.",
"CFM reforça refração e diagnóstico de miopia como ato médico":"A ADPF 131 é a ação no STF que discute os limites de atuação de optometristas. Para o CFM e o CBO, prescrever lentes envolve diagnóstico — a refração é também a porta de entrada para detectar ambliopia, glaucoma, retinopatias e doenças sistêmicas.",
"DAYBREAK: tarcocimab não inferior ao aflibercepte, com metade dos pacientes em 6/6 meses":"O tarcocimab é um anticorpo anti-VEGF ligado a um biopolímero, o que aumenta o tamanho da molécula e o tempo que ela permanece no vítreo. «Não inferior» significa que o ganho de visão ficou dentro da margem pré-definida em relação ao aflibercepte — não que seja melhor. O diferencial é a durabilidade: metade dos pacientes já estava em injeção semestral no 1º ano, enquanto o controle recebia a cada 8 semanas. O tabirafusp acrescenta bloqueio de IL-6, citocina ligada a edema crônico e resposta incompleta ao anti-VEGF.",
"SOL-1: implante de axitinibe supera aflibercepte em dose única":"Inibidores de tirosina-quinase bloqueiam o receptor de VEGF por dentro da célula (VEGFR-1, -2 e -3), em vez de sequestrar o VEGF como os anticorpos. O hidrogel se dissolve sozinho à medida que libera o fármaco. O desenho foi exigente: pacientes que já haviam respondido a 2 injeções receberam uma única dose de cada braço, e o desfecho foi quem perdeu visão sem retratamento — ou seja, testa diretamente a durabilidade de uma aplicação.",
"Duravyu (vorolanibe) falha desfecho primário no LUGANO":"O vorolanibe também é um inibidor de tirosina-quinase, em inserto de liberação prolongada. O contraste com o SOL-1 mostra que eficácia depende da molécula, da cinética de liberação e do desenho do estudo — não basta pertencer à mesma classe.",
"MOGENRY: 4 anos de durabilidade e PDUFA no 1º semestre de 2027":"Diferente do voretigene (Luxturna), que repõe o gene RPE65 e exige fotorreceptores vivos e cirurgia sub-retiniana, a optogenética atua depois que os fotorreceptores já morreram: torna fotossensíveis as células da retina interna. Por isso serve para qualquer mutação e é aplicada por injeção intravítrea simples.",
"Atrofia geográfica: novas métricas e o inibidor de inflamassoma K8":"Os inibidores de complemento aprovados nos EUA (pegcetacoplan e avacincaptad pegol) reduzem de forma modesta a velocidade de crescimento da área atrófica, sem ganho funcional claro nos estudos pivotais. Medir o avanço da borda em direção à fóvea capta melhor o que ameaça a visão central. A linha de pesquisa de Ambati liga o acúmulo de RNA Alu no EPR à ativação do inflamassoma NLRP3 e à morte dessas células — um alvo diferente do complemento.",
"FDA aprova Lucamzi, biossimilar de ranibizumabe":"Biossimilar é um biológico altamente semelhante ao de referência, sem diferença clinicamente relevante em eficácia e segurança, aprovado por comparação analítica e estudo clínico de equivalência. O efeito prático esperado é a queda de preço do anti-VEGF.",
"Lytenava: primeiro bevacizumabe oftálmico aprovado pelo FDA":"O bevacizumabe usado em retina vinha do frasco oncológico, fracionado em farmácias de manipulação — com variação de dose e risco de contaminação. O Lytenava não é biossimilar: é bevacizumabe formulado para uso intravítreo e aprovado com estudos próprios.",
"Brasil: Anvisa ainda sem medicamento registrado para atrofia geográfica":"O eculizumabe bloqueia o C5, mais adiante na cascata do complemento — mecanismo semelhante ao do avacincaptad pegol. Sem registro na Anvisa, o acesso a inibidores de complemento para AG depende de importação excepcional e, muitas vezes, de ação judicial.",
"Facectomia como 1ª cirurgia no ângulo fechado chega a 48,4%":"No fechamento angular primário, o cristalino contribui para o bloqueio pupilar e empurra o diafragma iridocristaliniano para a frente. O EAGLE (Lancet, 2016) randomizou pacientes ≥50 anos com GPAF ou FAP com PIO ≥30 mmHg para extração do cristalino transparente ou iridotomia: a facectomia deu melhor PIO, menos colírios, melhor qualidade de vida e foi custo-efetiva.",
"K-911 (bimatoprosta grenod): PDUFA em 30/04/2027":"O óxido nítrico relaxa as células da malha trabecular e do canal de Schlemm (via GMPc), aumentando o escoamento convencional — mesmo princípio do latanoprosteno bunod. As prostaglandinas aumentam o escoamento uveoescleral remodelando a matriz do músculo ciliar. Uma molécula, duas vias.",
"FDA libera OMNI Ultra (Sight Sciences)":"A canaloplastia viscodilata 360° do canal de Schlemm e dos coletores; a trabeculotomia abre a malha trabecular, principal ponto de resistência. Combinar as duas ataca a resistência em vários níveis da via convencional, sem deixar implante no olho.",
"iDose TR pode ser reaplicado":"O iDose é um implante de titânio ancorado na malha trabecular que libera travoprosta continuamente, contornando a baixa adesão a colírios. Antes a bula previa aplicação única; agora o implante esgotado pode ser substituído.",
"TECNIS PureSee chega ao mercado americano":"EDOF puramente refrativa altera o perfil de poder da óptica, sem anéis difrativos, por isso dispersa menos luz: menos halos e contraste preservado, ao custo de visão de perto limitada. Perfil ideal: quem dirige à noite e aceita óculos para leitura fina.",
"Fentolamina (Ryzumvi) ganha indicação para presbiopia":"A fentolamina é antagonista α-adrenérgico: relaxa o músculo dilatador e causa miose discreta, aumentando a profundidade de foco (efeito pinhole). Mióticos colinérgicos (pilocarpina, aceclidina, carbacol) contraem o esfíncter e, em graus variados, o músculo ciliar — o que explica cefaleia, miopização e o raro risco de descolamento de retina.",
"Epioxa (epi-on): resultados sustentados em 3 anos":"No protocolo de Dresden (epi-off) o epitélio é removido para a riboflavina penetrar, o que traz dor, risco de infecção e haze. O epi-on depende de uma formulação que atravessa o epitélio e de oxigênio suplementar — o O2 é consumido na reação de cross-linking. Kmax caindo 1,9 D significa aplanamento, não apenas estabilização.",
"Brasil: Anvisa suspende colírios da Excelvision":"Hyabak (hialuronato sem conservante) e Thealoz Duo (trealose + hialuronato) são lubrificantes muito usados no Brasil. Na prática: conferir o lote com o paciente, substituir por outro lubrificante e notificar eventos adversos suspeitos no Notivisa.",
"Derivado de membrana amniótica em olho seco: fase 2":"A membrana amniótica tem efeito anti-inflamatório e antifibrótico, atribuído em parte ao complexo HC-HA/PTX3. Levar isso a um colírio evitaria a aplicação de membrana com lente ou anel.",
"Terapias celulares para edema corneano avançam":"A ideia é cultivar células endoteliais de um doador e injetá-las na câmara anterior, de modo que uma córnea possa tratar muitos pacientes. O conceito foi demonstrado no Japão (grupo de Kinoshita) com células cultivadas associadas a inibidor de ROCK.",
"Ianalumabe na síndrome de Sjögren (NEJM)":"O ianalumabe bloqueia o receptor de BAFF e depleta linfócitos B. O estudo mostra uma dissociação comum em Sjögren: melhora objetiva da doença sistêmica sem melhora proporcional do olho seco e da boca seca — que dependem de dano glandular acumulado.",
"Adultos com estrabismo têm dificuldade de conseguir consulta":"Cirurgia de estrabismo no adulto não é só estética: pode eliminar diplopia, restaurar fusão, ampliar o campo binocular (na esotropia) e melhorar a função psicossocial. Mesmo desvios antigos costumam ter bom resultado de alinhamento.",
"Fotorrastreador por birrefringência perde para autorrefrator":"A birrefringência retiniana detecta se as duas fóveas fixam ao mesmo tempo (as fibras de Henle ao redor da fóvea são birrefringentes), o que em teoria identifica estrabismo e ambliopia. Fotorrastreadores e autorrefratores detectam fatores de risco ambliogênicos (anisometropia, alta ametropia), não a ambliopia em si.",
"Terapia binocular Luminopia: dados de registro":"O Luminopia exibe vídeos em óculos de realidade virtual com imagens diferentes para cada olho, obrigando o uso do olho amblíope em visão binocular. Foi aprovado pelo FDA em 2021 para crianças de 4 a 7 anos.",
"Cenegermina entra em fase 3 para NAION":"O NGF recombinante já é aprovado (Oxervate) para ceratite neurotrófica. Na NAION o racional é neuroproteção das células ganglionares após o insulto isquêmico ao disco.",
"Satralizumabe com revisão prioritária para MOGAD":"O satralizumabe já é aprovado para NMOSD com anti-AQP4. A MOGAD é uma entidade distinta, que recorre com frequência e hoje é tratada off-label (corticoide, imunoglobulina, rituximabe, tocilizumabe).",

async function checkPush(){
  if(location.protocol!=="https:" && location.hostname!=="localhost"){ pushState.status="nohost"; return; }
  if(!("serviceWorker" in navigator)){ pushState.status="unsupported"; return; }
  if(!("PushManager" in window) || !("Notification" in window)){ pushState.status = isIOS && !isStandalone() ? "ios-install" : "unsupported"; return; }
  if(Notification.permission==="denied"){ pushState.status="denied"; return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    pushState = sub ? {status:"on",sub} : {status:"off",sub:null};
  }catch(_){ pushState.status="off"; }
}
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){ pushState.status = perm==="denied"?"denied":"off"; render(); return; }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC_KEY) });

    <button class="fbtn ${liveArea==="noticia"?"on":""}" data-larea="noticia">Só notícias</button>
    <button class="fbtn ${liveArea==="artigo"?"on":""}" data-larea="artigo">Só artigos</button>
    ${ord.map(id=>{const a=AREAS.find(z=>z.id===id);return `<button class="fbtn ${liveArea===id?"on":""}" data-larea="${id}">${esc(a.name)}</button>`;}).join("")}</div>`;
  const q=state.q.trim().toLowerCase();
  const list=LIVE.items.filter(x=> (liveArea==="todas" || x.area===liveArea || x.kind===liveArea) && (!q || (x.t+" "+(x.s||"")+" "+x.src).toLowerCase().includes(q)) ).slice(0,150);
  html+= list.length ? `<div class="section"><div class="grid">${list.map(liveCard).join("")}</div></div>` : `<div class="empty">Nada encontrado com esse filtro.</div>`;
  return html;
}
function wireLive(){
  const e=$("#enablePush"); if(e) e.addEventListener("click",enablePush);
  const c=$("#copySub"); if(c) c.addEventListener("click",copySub);
  const s=$("#showSub"); if(s) s.addEventListener("click",()=>{ const t=$("#subcode"); t.hidden=!t.hidden; if(!t.hidden) t.select(); });
  document.querySelectorAll("[data-larea]").forEach(b=>b.addEventListener("click",()=>{ liveArea=b.dataset.larea; render(); }));
}
function markSeen(){ if(LIVE.updated){ setTimeout(()=>{ lastSeen=LIVE.updated; store.set("ou_lastSeen",lastSeen); },4000); } }


function allMarket(){
  const out=[];
  AREAS.forEach(a=>{ if(["aparelhos","labs","lios"].includes(a.id)) return; (a.market||[]).forEach(it=>out.push({...it, area:a})); });
  return out.sort((x,y)=>y.d.localeCompare(x.d));
}
function allArticles(){
  const out=[];
  AREAS.forEach(a=>{ if(["noticias","mercado","aparelhos","labs","lios"].includes(a.id)) return; (a.articles||[]).forEach(it=>out.push({...it, area:a})); });
  return out.sort((x,y)=>y.d.localeCompare(x.d));
}

function detailHTML(it){
  const b=BRIEFS[it.t]||{}; const e=EXPL[it.t];
  const blk=(h,v)=> (v && v!=="—") ? `<div class="blk"><h6>${h}</h6><p>${v}</p></div>` : "";
  const res=(b.r||[]).filter(x=>x&&x!=="—");
  const src=(it.src||[]).map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(" · ");
  return `<div class="dtitle">Resumo detalhado</div>
    ${e?`<div class="entenda"><h6>Entenda</h6><p>${e}</p></div>`:""}
    ${blk("O que é",b.o)}${blk("Como foi feito",b.m)}
    ${res.length?`<div class="blk"><h6>Resultados</h6><ul>${res.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
    ${blk("Por que importa",b.i)}${blk("Limitações e próximos passos",b.l)}
    ${src?`<div class="src">Fonte: ${src}</div>`:""}`;
}
function card(it, color, showArea){
  const tags=(it.tags||[]).map(t=>`<span class="chip ${chipClass(t)}">${esc(t)}</span>`).join("");
  const area= showArea&&it.area ? `<span class="chip area" style="color:${it.area.color}">${esc(it.area.name)}</span>` : "";
  const src=(it.src||[]).map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(" · ");
  return `<article class="card" tabindex="0" role="button" data-brief="${esc(it.t)}" style="--ac:${showArea&&it.area?it.area.color:color}">
    <div class="chead">${dateBadge(it.d)}<div class="cright"><div class="meta">${area}${tags}</div><h5>${esc(it.t)}</h5></div></div><p>${it.s}</p>
    ${it.p?`<div class="pearl"><b>Pérola:</b> ${it.p}</div>`:""}
    <div class="detail"><div class="detail-in">${detailHTML(it)}</div></div>
    <div class="more"><span class="lbl">Ler resumo detalhado</span><span class="arr">▾</span></div>
  </article>`;
}

function matches(it){
  const q=state.q.trim().toLowerCase();
  if(state.tag && !(it.tags||[]).includes(state.tag)) return false;
  if(!q) return true;
  return (it.t+" "+it.s+" "+(it.p||"")+" "+(it.tags||[]).join(" ")+" "+(it.area?it.area.name:"")).toLowerCase().includes(q);
}

function weeklyBox(a){
  const w=a.weekly; if(!w) return "";
  const src=(w.src||[]).map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(" · ");
  if(w.kind==="top3"){
    return `<section class="weekly"><span class="flag">★ Novidade da semana</span>
      <div class="date">${CAL}${esc(w.date)}</div><h3>${esc(w.title)}</h3>
      <div class="top3">${w.items.map((x,i)=>`<button class="t" data-go="${x.go}"><span class="n">${i+1}</span><span><b>${esc(x.t)}</b><small>${esc(x.s)}</small></span></button>`).join("")}</div>
    </section>`;
  }
  return `<section class="weekly"><span class="flag">★ Novidade da semana</span>
    <div class="date">${CAL}${esc(w.date)}</div><h3>${esc(w.title)}</h3>
    ${w.body}${w.pearl?`<div class="pearl">${w.pearl}</div>`:""}
    ${src?`<div class="src" style="font-size:12px;margin-top:8px">Fonte: ${src}</div>`:""}
  </section>`;
}

function section(title, items, color, showArea){
  const list=items.filter(matches).sort((x,y)=>(y.d||"").localeCompare(x.d||""));
  if(!items.length) return "";
  return `<div class="section"><h4>${title}</h4>${list.length?`<div class="grid">${list.map(it=>card(it,color,showArea)).join("")}</div>`:`<div class="empty">Nada encontrado com esse filtro.</div>`}</div>`;
}

function toolbar(items){
  const tags=[...new Set(items.flatMap(i=>i.tags||[]))].sort();
  return `<div class="toolbar"><input class="search" id="q" type="search" placeholder="Buscar nesta aba…" value="${esc(state.q)}">
    <button class="fbtn ${state.tag?"":"on"}" data-tag="">Todos</button>
    ${tags.map(t=>`<button class="fbtn ${state.tag===t?"on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>`;
}

function render(){
  const a=AREAS.find(x=>x.id===state.tab)||AREAS[0];
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", b.dataset.id===a.id));
  let html=`<div class="area-head"><span class="bar" style="background:${a.color}"></span><div><h2>${esc(a.name)}</h2><p>${esc(a.desc)}</p></div></div>`;
  html+=weeklyBox(a);

  if(a.id==="aovivo"){
    html+=renderLive();
    $("#main").innerHTML=html;
    const q=$("#q");
    if(q){ q.addEventListener("input",e=>{ state.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }); }
    wireLive(); paintTabBadge(); markSeen();
    return;
  }
  if(a.id==="noticias"){
    const latest=allArticles().slice(0,6);
    html+=toolbar([...a.articles,...latest]);
    html+=section("Manchetes & Brasil", a.articles, a.color, false);
    html+=section("Últimos artigos de todas as áreas", latest, a.color, true);
    html+=`<div class="section"><h4>Radar regulatório — próximas datas</h4><div class="radar">${a.radar.map(r=>`<div class="row"><div class="when">${esc(r[0])}</div><div class="what"><b>${esc(r[1])}</b><span>${esc(r[2])}</span></div></div>`).join("")}</div></div>`;
  } else if(a.id==="aparelhos" || a.id==="labs" || a.id==="lios"){
    const own=a.articles.map(x=>({...x}));
    const pick = it => a.id==="lios" ? !!it.iol : a.id==="aparelhos" ? ((it.tags||[]).includes("Aparelho") && !it.iol) : !!it.lab;
    const fromAreas=[];
    AREAS.forEach(z=>{ if(["noticias","aparelhos","labs","lios"].includes(z.id)) return; [...(z.articles||[]),...(z.market||[])].forEach(it=>{ if(pick(it)) fromAreas.push({...it, area:z}); }); });
    html+=toolbar([...own,...fromAreas]);
    a.subs.forEach(sb=>{ html+=section(sb, own.filter(x=>x.sub===sb), a.color, false); });
    html+=section({lios:"LIOs citadas nas subespecialidades",aparelhos:"Aparelhos citados nas subespecialidades",labs:"Fármacos, implantes e pipeline nas subespecialidades"}[a.id], fromAreas, a.color, true);
  } else if(a.id==="mercado"){
    const all=[...a.market.map(x=>({...x,area:a})), ...allMarket().filter(x=>x.area.id!=="mercado")].sort((x,y)=>y.d.localeCompare(x.d));
    html+=toolbar(all);
    html+=section("Negócios e movimentos de empresas — todas as áreas", all, a.color, true);
  } else {
    html+=toolbar([...a.articles,...a.market]);
    html+=section("Artigos & ensaios clínicos", a.articles, a.color, false);
    html+=section("Mercado: laboratórios & aparelhos", a.market, a.color, false);
  }
  $("#main").innerHTML=html;

  const q=$("#q");
  if(q){ q.addEventListener("input",e=>{ state.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }); }
  document.querySelectorAll(".fbtn").forEach(b=>b.addEventListener("click",()=>{ state.tag=b.dataset.tag||null; render(); }));
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  document.querySelectorAll(".card[data-brief]").forEach(c=>{
    c.setAttribute("aria-expanded","false");
    c.addEventListener("click",e=>{ if(e.target.closest("a")) return; toggleCard(c); });
    c.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleCard(c); } });
  });
}

function toggleCard(c){
  const open=!c.classList.contains("open");
  c.classList.toggle("open",open); c.setAttribute("aria-expanded",String(open));
  c.querySelector(".more .lbl").textContent= open ? "Recolher" : "Ler resumo detalhado";
  if(open) setTimeout(()=>{ const r=c.getBoundingClientRect(); if(r.top<60||r.top>window.innerHeight*0.5) window.scrollTo({top:window.scrollY+r.top-64,behavior:"smooth"}); },60);
}
function findItem(title){
  for(const a of AREAS){ for(const it of [...(a.articles||[]),...(a.market||[])]){ if(it.t===title) return {it,a}; } }
  return null;
}
function openBrief(title){
  const f=findItem(title); if(!f) return;
  const {it,a}=f; const b=BRIEFS[title]||{};
  const tags=(it.tags||[]).map(t=>`<span class="chip ${chipClass(t)}">${esc(t)}</span>`).join(" ");
  const blk=(h,v)=> (v && v!=="—") ? `<div class="blk"><h6>${h}</h6><p>${v}</p></div>` : "";
  const res=(b.r||[]).filter(x=>x&&x!=="—");
  const src=(it.src||[]).map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(" · ");
  const sh=$("#sheet"); sh.style.setProperty("--ac",a.color);
  sh.innerHTML=`<div class="grab"></div>
    <div class="top"><h3>${esc(it.t)}</h3><button class="x" id="closeSheet" aria-label="Fechar">✕</button></div>
    <div class="sdate">${CAL}${fmt(it.d)}</div><div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="chip area" style="color:${a.color}">${esc(a.name)}</span>${tags}</div>
    <div class="blk"><h6>Resumo</h6><p>${it.s}</p></div>
    ${blk("O que é",b.o)}${blk("Como foi feito",b.m)}
    ${res.length?`<div class="blk"><h6>Resultados</h6><ul>${res.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
    ${blk("Por que importa",b.i)}${blk("Limitações e próximos passos",b.l)}
    ${it.p?`<div class="pearl"><b>Pérola:</b> ${it.p}</div>`:""}
    ${src?`<div class="src">Fonte: ${src}</div>`:""}`;
  $("#sheetBg").classList.add("open"); $("#sheetBg").setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden"; sh.scrollTop=0;
  $("#closeSheet").addEventListener("click",closeBrief);
}
function closeBrief(){ $("#sheetBg").classList.remove("open"); $("#sheetBg").setAttribute("aria-hidden","true"); document.body.style.overflow=""; }

function go(id){
  state.tab=id; state.q=""; state.tag=null;
  if(location.hash!=="#"+id) history.replaceState(null,"","#"+id);
  render(); window.scrollTo({top:0,behavior:"smooth"});
  const t=document.querySelector(`.tab[data-id="${id}"]`); if(t) t.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}

function init(){

  $("#edition").textContent=EDITION.label;
  $("#tabs").innerHTML=AREAS.map(a=>`<button class="tab" role="tab" data-id="${a.id}"><span class="dot" style="background:${a.id==="noticias"?"#fff":a.color}"></span>${esc(a.name)}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>go(b.dataset.id)));
  $("#foot").innerHTML=`${esc(EDITION.label)} · ${esc(EDITION.period)}. Resumos em português feitos a partir das fontes linkadas; confira o original antes de aplicar na prática. Itens marcados como «pérola» são revisão de conceitos clássicos, não parte da notícia.`;
  const h=(location.hash||"").slice(1);
  state.tab=AREAS.some(a=>a.id===h)?h:"noticias";
  render();
  if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
  checkPush().then(()=>{ if(state.tab==="aovivo") render(); });
  loadLive();
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadLive(); });
  window.addEventListener("hashchange",()=>{ const k=location.hash.slice(1); if(AREAS.some(a=>a.id===k)&&k!==state.tab){ state.tab=k; render(); } });
}
init();
</script>
</body>
</html>
